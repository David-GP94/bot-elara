server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sandbox}

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bot.elara: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: mielara-storage-test

# ===========================================================================
# CONFIGURACIÓN COMÚN
# ===========================================================================
stripe:
  price-amount: 99900  # $999.00 MXN en centavos (ajusta al monto real)
  api-key: ${STRIPE_API_KEY}  # ← TU SECRET KEY DE TEST
  currency: mxn

