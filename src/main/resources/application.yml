server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:sandbox}

  datasource:
    url: jdbc:h2:file:./data/derma_onboarding;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true;MODE=MariaDB
    #url: jdbc:h2:file:/app/data/derma_onboarding;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true;MODE=MySQL
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bot.elara: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    # Logs de Feign para ver las peticiones HTTP
    com.bot.elara.Infrastructure.External.Clients.ElaraApi: DEBUG

# ===========================================================================
# CONFIGURACIÓN COMÚN
# ===========================================================================
stripe:
  price-amount: 99900  # $999.00 MXN en centavos (ajusta al monto real)
  api-key: ${STRIPE_API_KEY}  # ← TU SECRET KEY DE TEST
  currency: mxn

# MERCADOPAGO - CONFIGURACIÓN BASE
mercadopago:
  api:
    url: https://api.mercadopago.com
  access:
    token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-7902613642269998-101611-adb6650f6b6ae95de9678decd61c4ddc-2911743713}
  public:
    key:  ${MERCADOPAGO_PUBLIC_KEY:TEST-2ccea0bc-ed01-433e-af2e-c85c40353fc0}
  notification:
    url: ${MERCADOPAGO_WEBHOOK_URL:https://su-subfalcial-eulalia.ngrok-free.dev}
  price-amount: 99900
  currency: MXN

app:
  base-url: http://localhost:8080  # Default local, se sobrescribe en perfiles

# ===========================================================================
# CONFIGURACIÓN DE API EXTERNA ELARA
# ===========================================================================
elara:
  api:
    base-url: ${ELARA_API_URL:http://v2lara.com}
    timeout: 30000
    auth:
      # Credenciales del SISTEMA para obtener token de acceso
      # Este no es un usuario del bot, es para autenticar las peticiones de la app
      email: ${ELARA_SYSTEM_EMAIL:sistema@elara.com}
      password: ${ELARA_SYSTEM_PASSWORD:password_del_sistema}

# ===========================================================================
# CONFIGURACIÓN DE FEIGN
# ===========================================================================
feign:
  client:
    config:
      default:
        connectTimeout: 30000
        readTimeout: 30000
        loggerLevel: full
  compression:
    request:
      enabled: true
    response:
      enabled: true

---
# PERFIL: SANDBOX (Pruebas locales)
spring:
  config:
    activate:
      on-profile: sandbox

whatsapp:
  phone-number-id: 915165248340034
  access-token: ${WHATSAPP_SANDBOX_TOKEN}
  webhook-verify-token: mi_token_sandbox_2025
  base-url: https://graph.facebook.com/v20.0
  logo-path: classpath:static/logo-elara.jpg

stripe:
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}  # ← Valor dummy solo para pruebas locales
  # Si quieres usar el de Stripe CLI, cámbialo manualmente después de ejecutar stripe listen

