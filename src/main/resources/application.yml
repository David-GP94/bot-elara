  base-url: http://localhost:8080  # Para success/cancel locales

---
# PERFIL: PRODUCTION
spring:
  config:
    activate:
      on-profile: production

whatsapp:
  phone-number-id: ${WHATSAPP_PHONE_ID}
  access-token: ${WHATSAPP_ACCESS_TOKEN}
  webhook-verify-token: ${WHATSAPP_VERIFY_TOKEN}
  base-url: https://graph.facebook.com/v20.0

respondio:
  api-url: https://api.respond.io/v1
  api-key: ${RESPONDIO_API_KEY}

stripe:
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}  # ← Inyecta desde variable de entorno en producción
  # price-amount hereda el valor común de arriba
app:
  base-url: https://tu-dominio-real.com  # ← Cambia por tu dominio público (HTTPS obligatorio en prod)