services:
  app:
    build: .
    container_name: derma-onboarding-app
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=sandbox
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - WHATSAPP_SANDBOX_TOKEN=${WHATSAPP_SANDBOX_TOKEN}
      - INFRA_ENDPOINT_URL=${INFRA_ENDPOINT_URL}
      - INFRA_API_KEY=${INFRA_API_KEY}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY}
      - MERCADOPAGO_WEBHOOK_URL=${MERCADOPAGO_WEBHOOK_URL}
    volumes:
      - ./data:/app/data
    restart: "no"